<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadVision AI - Dashboard</title>
    <style>
        /* (Mantive o mesmo estilo anterior para não perder o layout) */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .dashboard-container { background-color: #111827; border: 1px solid #1f2937; border-radius: 24px; padding: 30px; width: 100%; max-width: 800px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); text-align: left; }
        .dash-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; padding-bottom: 20px; margin-bottom: 20px; }
        .search-box-container { margin-bottom: 25px; }
        .search-box-container input { width: 100%; background-color: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 15px 20px; color: #ffffff; font-size: 16px; outline: none; border: 2px solid #374151; }
        .search-box-container input:focus { border-color: #3b82f6; }
        .lead-card { background-color: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .lead-info h3 { font-size: 16px; color: #ffffff; margin-bottom: 4px; }
        .lead-info p { font-size: 13px; color: #9ca3af; margin-bottom: 10px; }
        .lead-action-btn { background-color: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; }
        .status-select { background-color: #111827; color: #d1d5db; border: 1px solid #374151; padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .badge { background-color: #10b981; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- TELA PRINCIPAL (DASHBOARD) -->
    <div id="dashboard-screen" class="dashboard-container">
        <div class="dash-header">
            <div>
                <h1>LeadVision <span>AI</span></h1>
                <p style="color: #9ca3af; font-size: 13px;">Pesquise por cidade, estado ou segmento</p>
            </div>
        </div>

        <!-- Apenas o campo de pesquisa -->
        <div class="search-box-container">
            <input type="text" id="input-busca" placeholder="🔍 Ex: São Paulo, Rio de Janeiro, Varejo..." onkeyup="pesquisarLeads()">
        </div>

        <div id="lista-leads">
            <!-- Exemplos cadastrados -->
            <div class="lead-card">
                <div class="lead-info">
                    <h3>Supermercado Exemplo Ltda</h3>
                    <p>Segmento: Varejo • Tubarão / SC</p>
                    <button class="lead-action-btn">✨ Gerar Abordagem</button>
                </div>
                <div class="lead-actions">
                    <span class="badge">98%</span>
                </div>
            </div>
            <div class="lead-card">
                <div class="lead-info">
                    <h3>Tech Inova SP</h3>
                    <p>Segmento: Varejo • São Paulo / SP</p>
                    <button class="lead-action-btn">✨ Gerar Abordagem</button>
                </div>
                <div class="lead-actions">
                    <span class="badge">97%</span>
                </div>
            </div>
            <div class="lead-card">
                <div class="lead-info">
                    <h3>Construtora Carioca</h3>
                    <p>Segmento: Construção • Rio de Janeiro / RJ</p>
                    <button class="lead-action-btn">✨ Gerar Abordagem</button>
                </div>
                <div class="lead-actions">
                    <span class="badge">94%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function pesquisarLeads() {
            const termo = document.getElementById('input-busca').value.toLowerCase();
            const cards = document.querySelectorAll('.lead-card');
            cards.forEach(card => {
                const textoCard = card.innerText.toLowerCase();
                // Mostra se o termo digitado estiver presente no texto do cartão
                card.style.display = textoCard.includes(termo) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
